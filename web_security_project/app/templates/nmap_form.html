<!DOCTYPE html>
<html>
<head>
    <title>Run Nmap Scan</title>
    <link rel="stylesheet" href= "style.css">
    <style>
        /* General styles */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #fff;
  background-image: url(/app/images/stickers.jpg);
  color: #6e0000;
}

/* Header styles */
h1 {
  background-color: #2a3e52;
  color: #fff;
  padding: 1rem 0;
  text-align: center;
  font-size: 1.5rem;
}

/* Navigation buttons */
.nav-buttons {
  display: flex;
  justify-content: center;
  margin: 1rem 0;
}

.nav-buttons a {
  text-decoration: none;
  color: white;
  background-color: #3e8ec5;
  padding: 0.5rem 1rem;
  margin: 0 0.5rem;
  border-radius: 5px;
  font-weight: bold;
}

.nav-buttons a:hover {
  background-color: #2a6da8;
}

/* Containers */
.container {
  margin: 2rem auto;
  padding: 1rem;
  max-width: 800px;
  background-color: rgb(12, 4, 4);
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

/* Buttons */
button {
  background-color: #3e8ec5;
  color: white;
  padding: 0.5rem 1rem;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 1rem;
}

button:hover {
  background-color: #2a6da8;
}

/* Footer */
footer {
  text-align: center;
  padding: 1rem;
  margin-top: 2rem;
  font-size: 0.9rem;
  color: #666;
  background-color: beige;
}

    </style>
</head>
<body>
    <h1>Run Nmap Scan</h1>
    <form action="{{ url_for('main_blueprint.run_nmap_scan') }}" method="POST">
        <label for="target_ip">Enter Target IP or Hostname:</label>
        <input type="text" name="target_ip" required>
        <button type="submit">Run Scan</button>
    </form>

</body>
</html>
